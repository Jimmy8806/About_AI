<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="contact.css">
</head>
<header>
    <nav id="main-nav">
        <ul class="nav-links">
            <a href="index.html">Home</a>
            <a href="fields.html">Fields</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </ul>
    </nav>
</header>

<body>

    <form method="post" action="#">
        <h1 id="contact-header">Contact Us</h1>

        <label for="fname">First Name</label>
        <input type="text" id="fname" name="fname" required placeholder="Your First Name">

        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lname" required placeholder="Your Last Name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="example@gmail.com">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="3" required placeholder="Give us your feedback"></textarea>

        <button type="submit">Submit</button>
    </form>
    <footer>
        <small id="year"></small>
    </footer>

    <script src="main.js"></script>
</body>

</html>
